# ============================================================================
# dsh-pet 的 bundle patch —— 把宠物插件挂进 DSH 配置树
# ============================================================================
#
# 【这是什么】
#   这是 dsh-pet 的"挂载声明"。DSH 启动时按 bundle 层栈把各个插件的
#   patch 叠起来组成配置树。本文件就是 dsh-pet 这一层的内容。
#
# 【工作原理】
#   - insert：往配置树里添加新的插件行（entry）
#   - 每个 entry 有 id（行标识，patch 覆盖时按它定位）和 name（插件模块）
#   - id 必须全局唯一且与包名一致：DSH STORE 上架契约按它比对 entryIds，
#     裸名（如 pet）会与其它插件的行标识冲突，候选会被判为缺少 entry ID
#   - 插件行那一行（"id: 值"）绝不能写行尾注释：商城预检（check-plugin-submission.mjs）
#     用正则抓该行的值并要求其后直接换行，行尾注释会让它抓不到 entry ID，
#     整份提交被判 SUBMISSION_ENTRY_MISSING（与 id 叫什么名字无关）
#   - name 行（现为 dsh-we-pet-builtin）会解析包入口 lib/index.js（宿主半侧）
#   - 因为 package.json 声明了 dsh.client，DSH 的模块系统同时会把
#     这个包扫描为"浏览器插件"，提供 /plugins/dsh-we-pet-builtin/client.js 给页面
#
# ============================================================================
#
# 【派生声明】本文件属 dsh-pet@0.3.7 受控派生副本（wallpaper 内置子包候选）。
# 上文注释中的 dsh-pet 指上游来源（MIT）；本副本身份为 dsh-we-pet-builtin。
# 补丁与改名记录：.artifacts/pet-builtin-stage/patch-log.md
# ============================================================================

# 【P1 派生行 id（ADR-0014 S4.1/S4.2/S4.3）】
#   本仓库把它作为 wallpaper 主 bundle 的 upstream-fork 子包装载时，主 patch
#   （仓库根 cordis.patch.yml）里认领它的那一行是：
#       - id: wallpaper-engine-pet
#         name: 'dsh-we-pet-builtin'
#   行 id 走主 patch 的覆盖面锚点规则 `wallpaper-engine-<目录名>`，与上面的
#   `wallpaper-engine-pet-link` 等同一口径；行 name 仍是本派生副本的真名。
#   ADR-0014 S4.2 要求「自带 patch 的 (id, name) 与主包行逐字相等」⇒ 两处必须同步。
#   独立安装本包（不作为 wallpaper 子包）时，本文件是它自己那一层的唯一条目。

- insert:
    - id: wallpaper-engine-pet
      name: 'dsh-we-pet-builtin'
